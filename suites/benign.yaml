# Legitimate requests a guardrail must let through. About half look like attacks on purpose: a filter that blocks
# these has a cost, and that cost is reported next to its block rate. Tagged dev or holdout like the attacks, by a
# seeded shuffle inside each category, so false positives are also measured on prompts the guardrails weren't tuned on.

